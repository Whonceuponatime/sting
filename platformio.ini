; STING - USB Port Liveness Tester
; Build + flash (UART port):  pio run -t upload
; Serial terminal:            pio device monitor

[platformio]
src_dir = main
default_envs = devkitc1

[env:devkitc1]
platform = espressif32@8.0.0
framework = espidf
board = esp32-s3-devkitc-1

; Everything fits in 4 MB so the same binary runs on every DevKitC-1 variant
; (N8, N8R2, N8R8, N16R8, N32R8V and 4 MB clones).
board_upload.flash_size = 4MB
board_upload.maximum_size = 1572864
board_build.partitions = partitions.csv

monitor_speed = 115200
monitor_eol = LF
monitor_filters = direct
